  async function renderCatalog(kind='anime'){state.route=kind;setPage('catalogPage');resetCatalogState();const prefs=getPrefs(),titleMap={anime:'ANIME <span>CATALOGUE</span>',trending:'TRENDING <span>ANIME</span>',latest:'LATEST <span>RELEASES</span>',rankings:'ANIME <span>RANKINGS</span>',genres:'GENRES <span>BROWSE</span>',az:'A-Z <span>ANIME</span>',recently:'RECENTLY <span>ADDED</span>',upcoming:'UPCOMING <span>ANIME</span>'};$('catalogPage').innerHTML=shell('AN',titleMap[kind]||titleMap.anime,'Browse/search/filter anime',`<form class="search-panel" id="catalogSearch"><input id="catalogSearchInput" placeholder="Search anime by title..." value="${esc(state.query)}"/><button class="btn-primary"><i class="fas fa-search"></i> Search</button></form>${kind==='genres'?`<div class="filter-row">${genres.map(g=>`<button class="chip-btn ${state.genre===g?'active':''}" onclick="setGenre('${esc(g)}')">${esc(g)}</button>`).join('')}</div>`:''}${kind==='az'?`<div class="az-strip" style="margin-bottom:18px">${letters.map(l=>`<button class="${state.letter===l?'active':''}" onclick="setLetter('${l}')">${l}</button>`).join('')}</div>`:''}<div class="catalog-options"><label class="pref-toggle"><input type="checkbox" id="infiniteScrollToggle" ${prefs.infiniteScroll?'checked':''}/> Infinite scroll</label></div><div class="${kind==='rankings'?'wide-grid':'grid'}" id="catalogGrid">${loading()}</div><div id="catalogMoreState"></div><div class="action-row" id="loadMoreRow" style="justify-content:center;margin-top:22px"><button class="btn-outline" onclick="nextPage()"><i class="fas fa-plus"></i> Load More</button></div><div class="infinite-sentinel" id="catalogSentinel"></div>`);$('catalogSearch').addEventListener('submit',e=>{e.preventDefault();state.query=$('catalogSearchInput').value.trim();state.page=1;renderCatalog('anime')});$('infiniteScrollToggle').addEventListener('change',e=>{setPref('infiniteScroll',e.target.checked);setupInfiniteScroll()});await loadCatalog(kind,false);setupIn   async function catalogPageData(kind){const q=(state.query||'').trim();if(q)return searchAnime(q,state.page);if(kind==='trending')return animePage(`/top/anime?filter=airing&page=${state.page}&limit=24`);if(kind==='latest')return animePage(`/seasons/now?page=${state.page}&limit=24`);if(kind==='rankings')return animePage(`/top/anime?filter=bypopularity&page=${state.page}&limit=24`);if(kind==='recently')return animePage(`/anime?order_by=start_date&sort=desc&page=${state.page}&limit=24&sfw=true`);if(kind==='upcoming')return jikanPageRange(p=>`/seasons/upcoming?page=${p}&limit=24`,state.page,2,24,isFutureAnime);if(kind==='genres'&&state.genre)return animePage(`/anime?q=${encodeURIComponent(state.genre)}&page=${state.page}&limit=24&sfw=true`);if(kind==='az')return jikanAzPage(state.letter||'All',state.page,24);return animePage(`/top/anime?filter=bypopularity&page=${state.page}&limit=24`)}
  async function loadCatalog(kind,append=false){const grid=$('catalogGrid'),more=$('catalogMoreState');if(state.loadingMore)return;const token=++state.catalogRequestToken;state.loadingMore=true;if(!append){state.catalogIds=new Set();grid.innerHTML=loading()}else more.innerHTML=loading();try{const page=state.page,result=await catalogPageData(kind);if(token!==state.catalogRequestToken||kind!==state.route)return;const fresh=dedupeAnime(result.items).filter(a=>{const malId=validMalId(a.malId||a.mal_id||a.id),key=`mal:${malId}`;if(state.catalogIds.has(key))return false;state.catalogIds.add(key);return true});state.hasMore=result.hasMore;if(!append)grid.innerHTML=fresh.length?fresh.map((a,i)=>kind==='rankings'?rankCard(a,(page-1)*24+i+1):card(a)).join(''):empty('No anime found. Try another search or filter.');else if(fresh.length)grid.insertAdjacentHTML('beforeend',fresh.map((a,i)=>kind==='rankings'?rankCard(a,(page-1)*24+i+1):card(a)).join(''));more.innerHTML=state.hasMore?'':empty('No more anime found.');$('loadMoreRow').style.display=state.hasMore?'flex':'none'}catch(e){if(token!==state.catalogRequestToken)return;state.hasMore=false;if(!append)grid.innerHTML=errorState('Anime data was slow or unavailable. Please try again.');else more.innerHTML=errorState('Could not load more anime.');$('loadMoreRow').style.display='none'}finally{if(token===state.catalogRequestToken)state.loadingMore=false}}
  function resetCatalogState(){state.page=1;state.hasMore=true;state.loadingMore=false;state.catalogIds=new Set();state.catalogRequestToken++;if(state.infiniteObserver){state.infiniteObserver.disconnect();state.infiniteObserver=null}if(state.route==='az')state.azCache={}}
  function setupInfiniteScroll(){if(state.infiniteObserver){state.infiniteObserver.disconnect();state.infiniteObserver=null}const prefs=getPrefs(),sentinel=$('catalogSentinel'),row=$('loadMoreRow');if(row)row.style.display=state.hasMore?'flex':'none';if(!prefs.infiniteScroll||!sentinel)return;state.infiniteObserver=new IntersectionObserver(entries=>{if(entries.some(e=>e.isIntersecting)&&state.hasMore&&!state.loadingMore)nextPage()},{rootMargin:'500px 0px'});state.infiniteObserver.observe(sentinel)}
  window.setGenre=g=>{state.genre=g;state.query='';state.page=1;renderCatalog('genres')};window.setLetter=l=>{state.letter=l;state.query='';state.page=1;state.hasMore=true;state.loadingMore=false;state.catalogIds=new Set();state.catalogRequestToken++;state.azCache={};renderCatalog('az')};window.nextPage=()=>{if(state.loadingMore||!state.hasMore)return;state.page++;loadCatalog(state.route,!!getPrefs().infiniteScroll)}
  function infoGrid(a){const vals=[['Type',a.format],['Status',a.status],['Release date',a.aired?.from?new Date(a.aired.from).toLocaleDateString():'Unknown'],['Studios',a.studios?.join(', ')||'Unknown'],['Seasons',seasonCount(a)],['Episodes',a.episodes||'Unknown'],['Duration',a.duration||'Unknown'],['Genres',a.genres?.join(', ')||'Unknown'],['Source',a.source||'Unknown'],['Score',a.score||'Unscored'],['Rank',a.rank?`#${a.rank}`:'Unknown'],['Broadcast',a.broadcast?.string||'Unknown']];return `<div class="info-grid">${vals.map(([l,v])=>`<div class="info-item"><div class="info-label">${esc(l)}</div><div class="info-value">${esc(v)}</div></div>`).join('')}</div>`}function seasonCount(a){const count=(a.relations||[]).filter(r=>/sequel|prequel/i.test(r.relation||'')).reduce((n,r)=>n+(r.entry?.filter(e=>e.type==='anime').length||0),1);return count>1?`${count}+ related season entries`:'1 or unspecified'}function relatedCards(a){const rel=(a.relations||[]).flatMap(r=>(r.entry||[]).filter(e=>e.type==='anime').map(e=>({rel:r.relation,...e}))).slice(0,10);return rel.length?rel.map(e=>`<article class="rank-card" onclick="location.hash='${detailsHref(e.mal_id)}'"><div class="rank-num"><i class="fas fa-link"></i></div><div style="grid-column:span 2"><div class="rank-title">${esc(e.name)}</div><div class="rank-stats"><span class="badge neon">${esc(e.rel)}</span></div></div></article>`).join(''):empty('No related season entries listed by Jikan.')}
  async function renderDetails(id){setPage('detailsPage');$('detailsPage').innerHTML=loading();try{const a=await animeById(id);state.currentAnime=a;const title=a.title.english||a.title.romaji;setMeta(`${title} - ANICADE`,strip(a.synopsis).slice(0,160)||'Anime details on ANICADE.',a.cover);$('detailsPage').innerHTML=`<section class="detail-hero"><div class="detail-bg" style="background-image:url('${a.cover}')"></div><div class="detail-poster"><img src="${a.cover}" alt="${esc(title)}"/></div><div class="detail-main"><div class="eyebrow">Anime details</div><h1>${esc(title)}</h1>${a.title.synonyms?.length||a.title.native?`<div class="alt-title">${esc([a.title.native,...(a.title.synonyms||[])].filter(Boolean).slice(0,4).join(' / '))}</div>`:''}<div class="badges">${[a.format,a.status,a.episodes?`${a.episodes} episodes`:null,a.season&&a.year?`${a.season} ${a.year}`:a.year,a.rating].filter(Boolean).map(x=>`<span class="badge neon">${esc(x)}</span>`).join('')}</div><p class="synopsis">${esc(strip(a.synopsis)||'No synopsis available.')}</p><div class="action-row"><a class="btn-primary" href="${watchHref(a.id,1)}"><i class="fas fa-play"></i> Watch Now</a><button class="btn-outline" onclick="toggleWatchlist(${a.id})"><i class="fas fa-bookmark"></i> Watchlist</button></div></div></section>${shell('INFO','SERIES <span>INFO</span>','Anime metadata',infoGrid(a))}${shell('CAST','CHARACTERS <span>& CAST</span>','Characters and voice cast',`<div class="characters-grid" id="charactersGrid">${loading()}</div>`)}${shell('SEASONS','SEASONS <span>& RELATED</span>','Related entries are not episodes',`<div class="wide-grid">${relatedCards(a)}</div>`)}${shell('REC','RECOMMENDED <span>ANIME</span>','Related picks',`<div class="grid" id="recommendGrid">${loading()}</div>`)}${azSection()}`;loadCharacters(a.id);loadRecommendations(a.id,'recommendGrid')}catch(e){$('detailsPage').innerHTML=shell('ERR','ANIME <span>UNAVAILABLE</span>','Could not load details',errorState('This anime could not be loa   async function loadCharacters(id){try{const d=await malFetch(`/anime/${id}/characters`,14000);const chars=(d.data||[]).slice(0,12);$('charactersGrid').innerHTML=chars.length?chars.map(c=>`<div class="char-card"><img src="${c.character?.images?.jpg?.image_url||'https://placehold.co/80x110/0d1120/00d4ff?text=A'}" alt="${esc(c.character?.name)}"/><div><div class="char-name">${esc(c.character?.name||'Unknown')}</div><div class="char-role">${esc(c.role||'Character')}</div><div class="anime-meta">${esc(c.voice_actors?.[0]?.person?.name||'Cast unavailable')}</div></div></div>`).join(''):empty('No character data available.')}catch(e){$('charactersGrid').innerHTML=errorState('Could not load cast right now.')}}
  async function loadRecommendations(id,target){try{const d=await malFetch(`/anime/${id}/recommendations`,14000);const ids=(d.data||[]).map(r=>r.entry?.mal_id).filter(Boolean).slice(0,10),items=[];for(const recId of ids){try{items.push(await animeById(recId))}catch(e){}}$(target).innerHTML=items.length?items.map(card).join(''):empty('No recommendations available for this anime.')}catch(e){$(target).innerHTML=errorState('Could not load recommendations.')}}
  function getPrefs(){return{autoplay:false,autoNext:true,autoSkipIntro:false,track:'sub',infiniteScroll:false,...readJson(ANICADE_KEYS.prefs,{})}}function setPref(key,value){const p=getPrefs();p[key]=value;writeJson(ANICADE_KEYS.prefs,p);showToast('Preference saved')}function saveProgress(malId,episode,patch={}){const id=validMalId(malId),ep=validEpisode(episode);if(!id||!ep)return;const map=readJson(ANICADE_KEYS.progress,{});map[`${id}:${ep}`]={malId:id,episode:ep,track:state.track,updatedAt:Date.now(),...patch};writeJson(ANICADE_KEYS.progress,map);if(!patch.silent)showToast('Progress saved')}function episodeButtons(a){const count=validEpisode(a.episodes);if(!count)return'<div class="state">Episode count unavailable from Jikan.</div>';let html='';for(let i=1;i<=Math.min(count,200);i++)html+=`<button class="episode-btn ${i===state.episode?'active':''}" onclick="setEpisode(${i})">${i}</button>`;return html}
  async function renderWatch(id){setPage('watchPage');$('watchPage').innerHTML=loading();try{const a=await animeById(id);state.currentAnime=a;const p=new URLSearchParams(location.hash.split('?')[1]||''),prefs=getPrefs(),maxEp=validEpisode(a.episodes),malId=validMalId(a.malId||a.mal_id||a.id);if(!malId)throw new Error('Invalid anime');state.episode=validEpisode(p.get('ep'))||1;if(maxEp&&state.episode>maxEp)state.episode=maxEp;state.track=validTrack(p.get('track'))||validTrack(prefs.track)||'sub';prefs.track=state.track;writeJson(ANICADE_KEYS.prefs,prefs);const title=a.title.english||a.title.romaji,src=zokoUrl(malId,state.episode,state.track);if(!src)throw new Error('Invalid stream URL');setMeta(`Watch ${title} - ANICADE`,`Watch ${title} episode ${state.episode} on ANICADE.`,a.cover);$('watchPage').innerHTML=`${shell('WATCH',`WATCH <span>${esc(title)}</span>`,'Anime ANICADE streaming',`<div class="watch-layout"><div><div class="player-box"><iframe id="anime-player" src="${src}" width="100%" height="500" allow="fullscreen; autoplay" allowfullscreen referrerpolicy="no-referrer-when-downgrade" title="${esc(title)} episode ${state.episode} ${state.track}"></iframe></div><div id="playerMessage" class="player-message">Episode ${state.episode} · ${state.track.toUpperCase()}</div><div class="action-row" style="margin-top:12px"><button class="btn-outline" onclick="saveProgress(${malId},state.episode,{started:true})"><i class="fas fa-clock"></i> Save Progress</button><a class="btn-outline" href="${detailsHref(malId)}"><i class="fas fa-info-circle"></i> Anime Details</a></div></div><aside class="episode-panel"><h2 class="section-title" style="font-size:24px">Episodes</h2><div class="track-toggle"><button class="chip-btn ${state.track==='dub'?'active':''}" onclick="setTrack('dub')">DUB</button><button class="chip-btn ${state.track==='sub'?'active':''}" onclick="setTrack('sub')">SUB</button></div><label class="anime-meta"><input type="checkbox" ${prefs.autoplay?'checked':''} onchange="setPref('autoplay',this.checked)"/> Autoplay</label><br/><label class="anime-meta"><input type="checkbox" ${prefs.autoNext?'checked':''} onchange="setPref('autoNext',this.checked)"/> Auto-next</label><br/><label class="anime-meta"><input type="checkbox" ${prefs.autoSkipIntro?'checked':''} onchange="setPref('autoSkipIntro',this.checked)"/> Auto-skip intro</label><div class="episode-list">${episodeButtons(a)}</div></aside></div>`)}${shell('ABOUT','ANIME <span>INFO</span>','Below the player',infoGrid(a))}${shell('REC','RELATED <span>ANIME</span>','Recommendations',`<div class="grid" id="watchRecs">${loading()}</div>`)}${azSection()}`;loadRecommendations(malId,'watchRecs');armWatchdog()}catch(e){$('watchPage').innerHTML=shell('ERR','WATCH <span>UNAVAILABLE</span>','Could not load watch page',errorState('This watch page could not be opened.'))}}
  function streamKey(id=state.currentAnime?.malId||state.currentAnime?.mal_id||state.currentAnime?.id,ep=state.episode){const malId=validMalId(id),episode=validEpisode(ep);return malId&&episode?`${malId}:${episode}`:''}function markStreamUi(track=state.track){document.querySelectorAll('.episode-btn').forEach((b,i)=>b.classList.toggle('active',i+1===state.episode));document.querySelectorAll('.track-toggle .chip-btn').forEach(b=>b.classList.toggle('active',b.textContent.trim().toLowerCase()===track))}
  function updateAnimePlayer(){const id=validMalId(state.currentAnime?.malId||state.currentAnime?.mal_id||state.currentAnime?.id),ep=validEpisode(state.episode),track=validTrack(state.track);if(!id||!ep||!track)return;const player=$('anime-player'),src=zokoUrl(id,ep,track);if(player&&src)player.src=src;markStreamUi(track);playerMessage(`Episode ${ep} · ${track.toUpperCase()}`);history.replaceState(null,'',watchHref(id,ep,track));armWatchdog()}function fallbackToSub(){const key=streamKey();if(state.track!=='dub'||!key||state.streamFallbacks.has(key))return false;state.streamFallbacks.add(key);state.track='sub';const prefs=getPrefs();prefs.track='sub';writeJson(ANICADE_KEYS.prefs,prefs);updateAnimePlayer();playerMessage(`DUB unavailable for episode ${state.episode}. Trying SUB...`);return true}function disarmWatchdog(){if(state.watchdogTimer){clearTimeout(state.watchdogTimer);state.watchdogTimer=null}state.watchdogToken++}function armWatchdog(){disarmWatchdog();if(state.track!=='dub')return;const key=streamKey(),token=state.watchdogToken;state.watchdogTimer=setTimeout(()=>{if(token!==state.watchdogToken||streamKey()!==key)return;if(!fallbackToSub())playerMessage('Anime unavailable for this episode in DUB or SUB',true)},9000)}window.setEpisode=ep=>{const n=validEpisode(ep);if(!n||!state.currentAnime)return;const max=validEpisode(state.currentAnime.episodes);state.episode=max&&n>max?max:n;state.streamFallbacks.delete(streamKey());updateAnimePlayer()};window.setTrack=t=>{const track=validTrack(t);if(!track||!state.currentAnime)return;state.track=track;if(track==='dub')state.streamFallbacks.delete(streamKey());setPref('track',track);updateAnimePlayer()};window.toggleWatchlist=id=>{const malId=validMalId(id),list=readJson(ANICADE_KEYS.watchlist,[]),exists=list.includes(malId),next=exists?list.filter(x=>x!==malId):[malId,...list];if(!malId)return;writeJson(ANICADE_KEYS.watchlist,next);showToast(exists?'Removed from watchlist':'Added to watchlist')}
  function playerMessage(msg,error=false){const el=$('playerMessage');if(el){el.textContent=msg;el.classList.toggle('error',error)}}window.addEventListener('message',event=>{if(event.origin!==ZOKO_ORIGIN)return;const data=event.data&&typeof event.data==='object'?event.data:{},type=data.type,payload=data.payload||{},malId=validMalId(state.currentAnime?.malId||state.currentAnime?.mal_id||state.currentAnime?.id);if(type==='progress'){disarmWatchdog();saveProgress(malId,state.episode,{currentTime:payload.currentTime||0,duration:payload.duration||0,silent:true});playerMessage(`Episode ${state.episode} · ${state.track.toUpperCase()} · Progress saved`)}else if(type==='complete'){disarmWatchdog();saveProgress(malId,state.episode,{complete:true,currentTime:payload.duration||payload.currentTime||0,duration:payload.duration||0,silent:true});playerMessage('Episode complete')}else if(type==='error'){disarmWatchdog();if(fallbackToSub())return;playerMessage('Anime unavailable for this episode in DUB or SUB',true)}});
  async function renderNews(){setPage('newsPage');$('newsPage').innerHTML=shell('NEWS','ANIME <span>NEWS</span>','News is separate from the watchable catalogue',`<div class="news-grid" id="newsGrid">${loading()}</div>`);try{const season=await list('/seasons/now?limit=8'),items=[];for(const a of season.slice(0,5)){try{const d=await malFetch(`/anime/${a.id}/news?page=1`,9000);(d.data||[]).slice(0,2).forEach(n=>items.push({title:n.title,excerpt:n.excerpt,date:n.date,image:n.images?.jpg?.large_image_url||n.images?.jpg?.image_url,anime:a}))}catch(e){}}$('newsGrid').innerHTML=items.length?items.map(newsCard).join(''):empty('No anime news is available right now.')}catch(e){$('newsGrid').innerHTML=errorState('Could not load news.')}}
  function newsCard(n){return `<article class="news-card"><img src="${n.image||n.anime.cover}" alt=""/><div class="news-body"><div class="news-source">Anime News</div><h3 class="news-title">${esc(n.title)}</h3><p class="news-excerpt">${esc(strip(n.excerpt).slice(0,160))}</p><div class="action-row" style="margin-top:12px">${n.anime?.id?`<a class="btn-outline" href="${detailsHref(n.anime.id)}"><i class="fas fa-info-circle"></i> Anime Details</a>`:''}</div></div></article>`}
  function route(){const raw=location.hash.replace(/^#/,'')||'/',[path,qs='']=raw.split('?'),p=new URLSearchParams(qs);state.query=p.get('q')||'';document.querySelectorAll('[data-nav]').forEach(a=>a.classList.remove('active'));let m;if(path==='/'||path==='/home'){state.route='home';document.querySelector('[data-nav=home]')?.classList.add('active');renderHome()}else if((m=path.match(/^\/anime\/(\d+)/))){state.route='details';renderDetails(m[1])}else if((m=path.match(/^\/watch\/(\d+)/))){state.route='watch';renderWatch(m[1])}else if(path==='/news'){state.route='news';document.querySelector('[data-nav=news]')?.classList.add('active');renderNews()}else{state.route=path.replace('/','')||'anime';document.querySelector(`[data-nav=${state.route}]`)?.classList.add('active');if(state.route==='az')state.letter=p.get('letter')||'All';renderCatalog(state.route)}$('navLinks').classList.remove('open')}
